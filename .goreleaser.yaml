version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: webdav-tunnel
    main: .
    binary: webdav-tunnel
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: webdav-tunnel
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - docs/**

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: "Fixes"
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: "Performance"
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: "Other"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - Merge pull request
      - Merge branch

release:
  footer: |
    ## Verifying

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    ```
